name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # type check + translation completeness check
      - name: Check
        run: npm run check

      # deterministic simulator, approval boundaries, rollback, i18n tests
      - name: Test
        run: npm test

      # static build → dist/
      # SITE_BASE defaults to "/" (custom domain layer.caipex.site).
      # For https://USER.github.io/REPO/ set SITE_BASE=/REPO/ here.
      - name: Build
        run: npm run build
        env:
          SITE_BASE: ${{ vars.SITE_BASE || '/' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
